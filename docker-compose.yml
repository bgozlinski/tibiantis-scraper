services:

  # ─── Infrastructure ───────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ─── Migration (one-shot) ─────────────────────────────────────────

  migrate:
    image: ghcr.io/bgozlinski/tibiantis-scraper:master
    build: .
    env_file: .env
    command: python manage.py migrate --noinput
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ─── Application services (shared image) ──────────────────────────

  web:
    image: ghcr.io/bgozlinski/tibiantis-scraper:master
    build: .
    env_file: .env
    command:
      - gunicorn
      - config.wsgi:application
      - --bind=0.0.0.0:8000
      - --workers=2
      - --threads=2
      - --timeout=60
      - --access-logfile=-
      - --error-logfile=-
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  celery_worker:
    image: ghcr.io/bgozlinski/tibiantis-scraper:master
    build: .
    env_file: .env
    command:
      - celery
      - -A
      - config
      - worker
      - -l
      - info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  celery_beat:
    image: ghcr.io/bgozlinski/tibiantis-scraper:master
    build: .
    env_file: .env
    command:
      - celery
      - -A
      - config
      - beat
      - -l
      - info
      - --pidfile=/tmp/celerybeat.pid
      - --schedule=/tmp/celerybeat-schedule
      - --scheduler=django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/celerybeat.pid && kill -0 $$(cat /tmp/celerybeat.pid) 2>/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  discord_bot:
    image: ghcr.io/bgozlinski/tibiantis-scraper:master
    build: .
    env_file: .env
    command: python manage.py run_discord_bot
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    restart: unless-stopped



volumes:
  postgres_data:
  mongo_data:
